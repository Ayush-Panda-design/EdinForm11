# Keeps the Render free-tier API awake and runs scheduled jobs.
# Requires repo secrets:
#   API_BASE_URL  — e.g. https://edinform11-2.onrender.com
#   CRON_SECRET   — shared secret (same as Render env CRON_SECRET)

name: Keep-alive & cron

on:
  schedule:
    # Every 10 minutes — prevents free-tier sleep (~15 min idle)
    - cron: "*/10 * * * *"
    # Daily digest at 09:05 UTC
    - cron: "5 9 * * *"
    # Draft cleanup at 03:15 UTC
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run"
        required: true
        default: "keepalive"
        type: choice
        options:
          - keepalive
          - digest
          - cleanup-drafts

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve job
        id: job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "5 9 * * *" ]; then
            echo "name=digest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 3 * * *" ]; then
            echo "name=cleanup-drafts" >> "$GITHUB_OUTPUT"
          else
            echo "name=keepalive" >> "$GITHUB_OUTPUT"
          fi

      - name: Wake API
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL secret not set — skipping"
            exit 0
          fi
          BASE="${API_BASE_URL%/}"
          echo "Waking $BASE ..."
          curl -fsS --retry 3 --retry-delay 5 "$BASE/internal/wake" | tee wake.json
          curl -fsS --retry 3 --retry-delay 5 "$BASE/health" | tee health.json

      - name: Run scheduled job
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ steps.job.outputs.name }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL secret not set — skipping"
            exit 0
          fi
          BASE="${API_BASE_URL%/}"
          echo "Running job: $JOB"
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS --retry 2 --retry-delay 5 \
              -X POST "$BASE/internal/cron/$JOB" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" \
              | tee job.json
          else
            echo "CRON_SECRET not set — wake-only mode"
          fi
